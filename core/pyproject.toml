[project]
name = "repoflare-core"
version = "0.1.0"
description = "RepoFlare shared repository-intelligence core: scanning, parsing, graph, impact analysis, and AI reasoning — used by both the CLI and the VS Code extension."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "typer>=0.15.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pathspec>=0.12.0",
]

[project.scripts]
repoflare = "repoflare_core.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoflare_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
